services:
  srpm-vue-api:
    build: ./backend
    image: srpm-vue-api:20260828
    container_name: srpm-vue-18101-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/srpm;MODE=MySQL
    volumes:
      - srpm-vue-18101-data:/data
  srpm-vue-web:
    build: ./frontend
    image: srpm-vue-web:20260828
    container_name: srpm-vue-18101-web
    restart: unless-stopped
    depends_on:
      - srpm-vue-api
    ports:
      - "18101:80"

volumes:
  srpm-vue-18101-data:
    name: srpm-vue-18101-data
